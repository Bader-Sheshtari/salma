# Launch Hardening V1 — minimal CI: make code failures visible BEFORE Vercel
# deploys. Install → typecheck → lint → production build, nothing heavier.
# The build runs with no secrets on purpose: the app is verified to build
# env-free (all env access happens at request time), so a build that needs a
# secret is itself a regression this catches.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (clean, from lockfile)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  # Mandatory editorial-pipeline unit tests (owner condition 2). The Edge
  # Function suites are pure TypeScript run by Node's native test runner with
  # built-in type stripping (Node 24) — no install, no network, no secrets, no
  # live model calls (every LLM/transport is a stub).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Edge Function unit tests (ingest-news + develop-story)
        run: node --test supabase/functions/ingest-news/*.test.ts supabase/functions/develop-story/*.test.ts
