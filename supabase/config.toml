# Supabase project configuration.
# Only settings Salma needs to pin are listed here; everything else uses
# Supabase defaults.

# The AI cover-image generator spends real OpenRouter credit, so the Supabase
# gateway must reject any request without a valid signed user JWT before our
# code runs. Pinned here so every future deploy preserves JWT verification
# (in addition to setting it at deploy time).
[functions.generate-image]
verify_jwt = true

# radar-rank spends real OpenRouter credit and is triggered only by the secure
# pg_cron job (anon bearer) or an admin. Require a valid signed JWT at the
# gateway so no unauthenticated request can run the ranker.
[functions.radar-rank]
verify_jwt = true

# radar-shadow spends real Event Registry quota and is triggered only by the
# pg_cron wrappers (anon bearer + x-ingest-secret). Gateway JWT verification is
# pinned; real authorization is the in-code INGEST_SECRET check.
[functions.radar-shadow]
verify_jwt = true

# radar-editorial-select (ESL) selects and promotes stories to Content PENDING.
# Triggered only by pg_cron run_esl() (anon bearer + x-ingest-secret). Gateway
# JWT verification pinned; real authorization is the in-code INGEST_SECRET
# check, and the daily cap is clamped server-side (authz.ts).
[functions.radar-editorial-select]
verify_jwt = true

# radar-translate fetches an external URL and spends OpenRouter credit on an
# on-demand reading-aid translation. It is admin-only: require a valid signed JWT
# at the gateway (the function additionally re-checks the caller's admin role).
[functions.radar-translate]
verify_jwt = true

# develop-story (After the News V1) runs multi-call AI research/drafting and
# creates pending Content. Callers: staff JWT (editor+) or the service-role key
# (operational/system); the function re-checks the role itself. Gateway JWT
# verification pinned like the other credit-spending functions.
[functions.develop-story]
verify_jwt = true

# ingest-news does its own auth (admin JWT or x-ingest-secret from pg_cron);
# gateway JWT verification has always been DISABLED for it. Pinned so a plain
# `supabase functions deploy` cannot silently flip it.
[functions.ingest-news]
verify_jwt = false
